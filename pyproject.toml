[project]
name = "halyk-agentic-challenge"
version = "0.1.0"
description = "Document-grounded banking agent: reads a document pack, resolves current versions, computes and answers with page-level evidence."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pillow>=10.3",
]

[project.scripts]
hac = "hac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hac"]
